org: acme
repos:
  include: ["*"]          # Dependabot alert issues, except repos Inspector tracks (inspector below)
  exclude: ["sandbox-*"]  # left alone by every topic and by rollout
owners:
  payments-api: ["@acme/payments"]
default_owners: ["@acme/platform"]
escalation:
  after_days_overdue: 7
  severities: [critical, high]
  mentions: ["@acme/security"]
rollout:
  workflow_repo: vulgard
  engine: osv
  auto_merge: ["payments-*"]
slack:
  escalation_channel: "#security-escalations"
  default_channel: "#eng-alerts"
  channels:
    "@acme/payments": "#payments-eng"
    "@acme/frontend": "#frontend"
  users:
    "@jlee": U012JLEE
    "@acme/security": S01SECURITY
    sam@acme.com: U01SAM  # emails work too: rollout --slack DMs linear.leads
linear:
  default_team: SEC
  teams:
    "@acme/payments":
      team: PAY
      labels: [vulgard, security]
      project: Security debt
      state: Triage
      severity_labels: {critical: Critical, high: High, medium: Medium, low: Low}
  users:
    "@jlee": jlee@acme.com
  leads:
    SEC: sam@acme.com
exceptions:
  - repo: web-storefront
    package: nanoid
    reason: Only used by build tooling; never shipped to browsers.
    expires: 2030-12-31
deployments:
  enabled: true
  people:
    jlee: "@jlee"
  attribution:
    "storefront*": web-storefront
  unattributed_repo: vulgard
  workflows:
    payments-api: deploy.yml
  aws:
    regions: [us-east-1]
    deploy_role_arn: arn:aws:iam::111122223333:role/GithubCI
    delete_role_arn: arn:aws:iam::111122223333:role/VulgardStackDelete
  vercel:
    team_id: team_acme
  auto:
    repos: ["payments-*"]
inspector:
  enabled: true
  min_severity: high
