[project]
name = "vulgard"
version = "0.1.0"
description = "Org-wide enforcement for dependency vulnerabilities: SLA nagging, Dependabot auto-merge, and PR blocking."
readme = "README.md"
authors = [
    { name = "Juzer Nomani" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
vulgard = "vulgard.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "yaml"]
ignore_missing_imports = true

