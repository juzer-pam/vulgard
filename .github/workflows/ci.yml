name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run vulgard --config examples/vulgard.yml --fixtures examples/demo-org.json report
      - run: >-
          uv run vulgard --config examples/vulgard.yml --fixtures examples/demo-org.json
          nag --slack --linear
