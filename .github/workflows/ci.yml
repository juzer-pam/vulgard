name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run vulgard --config examples/vulgard.yml --fixtures examples/demo-org.json report
      - run: >-
          uv run vulgard --config examples/vulgard.yml --fixtures examples/demo-org.json
          nag --slack --linear

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run mypy

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx cdk synth --strict -c githubOrg=acme -c writes=true > /dev/null
      - run: npx cdk synth --strict -c githubOrg=acme > /dev/null

