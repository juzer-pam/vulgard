# Used by `vulgard enforce --mode workflow`: an org ruleset runs this workflow on
# every PR in every repo, with no per-repo files needed. Requires org rulesets with
# required workflows (GitHub Enterprise Cloud) and the dependency graph on target repos.
name: guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
