# Redeploys or removes one stack for vulgard. Repos call it from
# .github/workflows/vulgard-lifecycle.yml, which `vulgard rollout --lifecycle` adds and
# vulgard dispatches.
name: vulgard lifecycle

on:
  workflow_call:
    inputs:
      action:
        description: redeploy | delete
        type: string
        required: true
      framework:
        description: serverless | sst | cdk
        type: string
        required: true
      app:
        type: string
        required: true
      stage:
        type: string
        default: ""
      stack:
        description: CloudFormation stack name, for CDK
        type: string
        default: ""
      request_id:
        type: string
        required: true
      role:
        description: IAM role the repo deploys with (assumed through GitHub OIDC)
        type: string
        required: true
      region:
        type: string
        default: us-east-1
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"

permissions:
  contents: read
  id-token: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: vulgard-lifecycle-${{ inputs.app }}-${{ inputs.stage || inputs.stack }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ACTION: ${{ inputs.action }}
      FRAMEWORK: ${{ inputs.framework }}
      STAGE: ${{ inputs.stage }}
      STACK: ${{ inputs.stack }}
    steps:
      # These two run before checkout, so they can't use the job's working-directory default.
      - name: Only vulgard's app or a repo admin can run this
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          case "$ACTOR" in *"[bot]") exit 0 ;; esac
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$perm" != admin ]; then
            echo "$ACTOR is neither an app nor a repo admin"; exit 1
          fi
      - name: Validate inputs
        working-directory: ${{ github.workspace }}
        run: |
          case "$ACTION" in redeploy|delete) ;; *) echo "bad action: $ACTION"; exit 1 ;; esac
          case "$FRAMEWORK" in serverless|sst|cdk) ;; *) echo "bad framework: $FRAMEWORK"; exit 1 ;; esac
          for v in "$STAGE" "$STACK"; do
            if ! [[ "$v" =~ ^[A-Za-z0-9._-]*$ ]]; then echo "bad stage or stack: $v"; exit 1; fi
          done
          # Same idea as vulgard's own tiering: a production word anywhere in the name, any case.
          lc=$(printf '%s %s' "$STAGE" "$STACK" | tr '[:upper:]' '[:lower:]')
          if [ "$ACTION" = delete ] && [[ "$lc" =~ (^|[^a-z0-9])(prod|prd|production|live)([^a-z0-9]|$) ]]; then
            echo "vulgard never deletes production"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role }}
          aws-region: ${{ inputs.region }}
      - name: ${{ inputs.action }} ${{ inputs.framework }} ${{ inputs.stage || inputs.stack }}
        run: |
          case "$FRAMEWORK:$ACTION" in
            serverless:redeploy) npx serverless deploy --stage "$STAGE" ;;
            sst:redeploy)        npx sst deploy --stage "$STAGE" ;;
            sst:delete)          npx sst remove --stage "$STAGE" ;;
            cdk:redeploy)        npx cdk deploy "$STACK" --require-approval never ;;
            *) echo "vulgard deletes $FRAMEWORK stacks natively, not here"; exit 1 ;;
          esac
