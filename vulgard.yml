# vulgard configuration. `org` defaults to the owner of this repo when run from
# the scheduled workflow (passed via --org), so it is left unset here.

repos:
  include: ["*"]
  exclude: []            # e.g. ["sandbox-*", "legacy-monolith"]

# Days from when an alert opened until it must be fixed.
sla_days:
  critical: 7
  high: 30
  medium: 90
  low: 180

due_soon_days: 5          # flag alerts this close to their deadline
stale_pr_days: 14         # Dependabot PRs open this long get called out
ready_pr_days: 2          # green, mergeable PRs open this long ping owners to review/merge
reminder_interval_days: 7 # how often to re-ping owners while anything is overdue

# Who gets pinged. Falls back to the `*` rule in CODEOWNERS, then default_owners.
owners: {}
#   payments-api: ["@your-org/payments"]
default_owners: []

escalation:
  after_days_overdue: 7
  severities: [critical, high]
  mentions: []            # e.g. ["@your-org/security", "@cto-handle"]

issue:
  label: vulgard
  title: "Security debt: vulnerable dependencies need attention"

slack:
  token_env: SLACK_BOT_TOKEN      # bot scopes: chat:write, chat:write.public, im:write
  webhook_env: SLACK_WEBHOOK_URL  # leaderboard fallback when there's no bot token
  default_channel: null           # org-wide, e.g. "#engineering": gets the team leaderboard,
                                  # plus updates for repos with no channel mapping
  escalation_channel: null        # e.g. "#security-escalations"
  channels: {}                    # repo name/glob or owner handle -> channel
#   payments-api: "#payments-eng"
#   "@your-org/frontend": "#frontend"
  users: {}                       # GitHub handle -> Slack user (U…) or user group (S…) ID
#   "@octocat": U012ABCDEF
#   "@your-org/security": S012ABCDEF
  dm_owners: true                 # DM individual owners one summary per run

linear:
  api_key_env: LINEAR_API_KEY
  default_team: null              # Linear team key, e.g. SEC; required to create issues
  labels: [vulgard]               # team label if one has the name, else a workspace label
  project: null                   # project name new issues are added to
  state: null                     # state for new/reopened issues, e.g. Triage; null = default
  severity_labels: {}             # worst open severity -> label, swapped as it changes, e.g.
                                  # {critical: Critical, high: High, medium: Medium, low: Low}
  teams: {}                       # repo name/glob or owner handle -> team key or settings
#   "@your-org/frontend": WEB
#   "@your-org/payments":         # labels/project/state/severity_labels override the defaults
#     team: PAY
#     labels: [vulgard, security]
#     project: Security debt
#     state: Triage
  users: {}                       # GitHub handle -> Linear user email (issue assignee)

kev:
  enabled: true                   # CISA Known Exploited Vulnerabilities catalog
  sla_days: 3                     # deadline for exploited CVEs; they escalate once overdue

# Accepted risks. Each needs a reason and an expiry; the alert returns when it lapses.
exceptions: []
#  - repo: payments-api           # glob, default "*"
#    advisory: GHSA-xxxx-xxxx-xxxx  # or CVE id; and/or `package: lodash`
#    reason: Not reachable; see SEC-123
#    expires: 2027-03-31

rollout:
  workflow_repo: vulgard        # the repo hosting these reusable workflows
  workflow_ref: main
  fail_on_severity: high          # low | medium | high | critical
  engine: github                  # github (needs GHAS on private repos) | osv
  auto_merge: []                  # repos (names or globs) that opt in, e.g. ["web-*"]; ["*"] = all
  auto_merge_update_types:
    - version-update:semver-patch
    - version-update:semver-minor
  schedule_interval: weekly
  branch: vulgard/rollout

# Stale deployments: every stack needs a deploy every `stale_days`, every repo a human commit
# every `repo_inactive_days`. Anything older needs a baseline within `baseline_days`: redeploy,
# delete, or `/vulgard keep` / `/vulgard active` on the repo's `vulgard-stale` issue.
deployments:
  enabled: false                  # also scans AWS (CloudFormation, SST, Amplify) and Vercel
  report_only: false              # true: findings in the step summary only; no issues or pings
  stale_days: 30
  baseline_days: 14
  repo_inactive_days: 90
  max_keep_days: 180              # the longest `/vulgard keep … until` or `active until`
  production_stages: [production, prod, live]   # a match anywhere in the name or tags
  shared_stages: [development, dev, staging, stage, preview, test]
  severity: {production: high, shared: medium, personal: low}  # drives escalation and Linear
  repo_severity: low              # for inactive repos
  people: {}                      # stage or OS username -> GitHub handle; marks personal stacks
#   jlee: "@jlee"
  attribution: {}                 # app or stack glob -> repo, wins over tags and manifests
  ignore: []                      # app or stack globs never tracked
  unattributed_repo: null         # required: deployments with no known repo are tracked here
  label: vulgard-stale
  title: Stale deployments need a baseline
  linear: {}                      # labels/project/state for this topic's Linear issues
  workflows: {}                   # repo -> its own deploy workflow, instead of vulgard-lifecycle.yml
  lifecycle_workflow: vulgard-lifecycle.yml
  auto:                           # automatic ops on personal deployments; off unless repos match
    repos: []                     # opt-in globs, e.g. ["pam-*"]
    delete: false                 # false: redeploy them; true: delete them
    personal_stale_days: 90
    notice_days: 7                # notice on the issue first; keep or cancel stops it
  aws:
    regions: [us-east-1]          # credentials come from the environment (GitHub OIDC in CI)
    delete_role_arn: null         # CloudFormation service role that deletes stacks' resources
    deploy_role_arn: null         # the role repos deploy with, for vulgard-lifecycle.yml
  vercel:
    team_id: null                 # with $VERCEL_TOKEN set, Vercel projects are scanned too
    token_env: VERCEL_TOKEN
