# vulgard configuration. `org` defaults to the owner of this repo when run from
# the scheduled workflow (passed via --org), so it is left unset here.

repos:
  include: ["*"]
  exclude: []            # e.g. ["sandbox-*", "legacy-monolith"]

# Days from when an alert opened until it must be fixed.
sla_days:
  critical: 7
  high: 30
  medium: 90
  low: 180

due_soon_days: 5          # flag alerts this close to their deadline
stale_pr_days: 14         # Dependabot PRs open this long get called out
ready_pr_days: 2          # green, mergeable PRs open this long ping owners to review/merge
reminder_interval_days: 7 # how often to re-ping owners while anything is overdue

# Who gets pinged. Falls back to the `*` rule in CODEOWNERS, then default_owners.
owners: {}
#   payments-api: ["@your-org/payments"]
default_owners: []

escalation:
  after_days_overdue: 7
  severities: [critical, high]
  mentions: []            # e.g. ["@your-org/security", "@cto-handle"]

issue:
  label: vulgard
  title: "Security debt: vulnerable dependencies need attention"

slack:
  token_env: SLACK_BOT_TOKEN      # bot scopes: chat:write, chat:write.public, im:write
  webhook_env: SLACK_WEBHOOK_URL  # digest fallback when there's no bot token
  digest_channel: null            # e.g. "#security"; weekly-style org digest
  escalation_channel: null        # e.g. "#security-escalations"
  default_channel: null           # repos with no channel mapping post here
  channels: {}                    # repo name or owner handle -> channel
#   "@your-org/payments": "#payments-eng"
  users: {}                       # GitHub handle -> Slack user (U…) or user group (S…) ID
#   "@octocat": U012ABCDEF
#   "@your-org/security": S012ABCDEF
  dm_owners: true                 # DM individual owners one summary per run

linear:
  api_key_env: LINEAR_API_KEY
  default_team: null              # Linear team key, e.g. SEC; required to create issues
  teams: {}                       # repo name or owner handle -> Linear team key
  users: {}                       # GitHub handle -> Linear user email (issue assignee)
  label: vulgard

kev:
  enabled: true                   # CISA Known Exploited Vulnerabilities catalog
  sla_days: 3                     # deadline for exploited CVEs; they escalate once overdue

# Accepted risks. Each needs a reason and an expiry; the alert returns when it lapses.
exceptions: []
#  - repo: payments-api           # glob, default "*"
#    advisory: GHSA-xxxx-xxxx-xxxx  # or CVE id; and/or `package: lodash`
#    reason: Not reachable; see SEC-123
#    expires: 2027-03-31

rollout:
  workflow_repo: vulgard        # the repo hosting these reusable workflows
  workflow_ref: main
  fail_on_severity: high          # low | medium | high | critical
  engine: github                  # github (needs GHAS on private repos) | osv
  auto_merge: true
  auto_merge_update_types:
    - version-update:semver-patch
    - version-update:semver-minor
  schedule_interval: weekly
  branch: vulgard/rollout
